# Cascade Training Stage 2: FineBio-Only PCR with IMFE
# Train from scratch on ONLY FineBio PCR videos (excluding mydata) with IMFE features
# IMFE features are 2048D from RT-HARE model
# This creates an intermediate checkpoint for Stage 3 K-fold on mydata

exp_name: finebio_only_stage2_imfe
exp_dir: /work3/s204157/experiments/finebio_only_stage2_imfe
device: cuda:0

pretrained:
  checkpoint: null  # Train from scratch (no IMFE atomic pretrain)
  num_classes: null

data:
  # Only FineBio PCR videos (42 videos)
  splits: /work3/s204157/data/labassist/combined_pcr/cache/splits_finebio_only.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_imfe
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6  # Higher capacity for training from scratch
  num_f_maps: 64
  features_dim: 2048  # IMFE feature dimension

training:
  num_epochs: 150  # Longer training from scratch
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.25
  smoothing_lambda: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

