# Stage 2: Train on FineBio-only PCR videos (intermediate model)
# This creates an intermediate checkpoint between atomic actions and mydata
# To be used as pretrained weights for mydata K-fold experiments

exp_name: finebio_only_stage2
exp_dir: /work3/s204157/experiments/finebio_only_stage2
device: cuda:0

# Start from FineBio atomic pretrained model
pretrained:
  checkpoint: /work3/s204157/experiments/finebio_atomic_pretrain/epoch-110.model
  num_classes: 36  # FineBio has 36 atomic actions

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/splits_finebio_only.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_i3d_selective_crop_flip_win16
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 3  # Reduced capacity for regularization
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 100
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.5  # High dropout
  smoothing_lambda: 0.3   # Strong smoothing
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

logging:
  log_interval: 10
  save_every_n_epochs: 2

