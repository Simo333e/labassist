# Cascade Training Stage 2: FineBio-Only PCR with ResNet+Motion
# Train on ONLY FineBio PCR videos (excluding mydata) with ResNet18+Motion features
# Starting from atomic action pretrained checkpoint (epoch-50)
# This creates an intermediate checkpoint for Stage 3 K-fold on mydata

exp_name: finebio_only_stage2_resnet_motion
exp_dir: /work3/s204157/experiments/finebio_only_stage2_resnet_motion
device: cuda:0

pretrained:
  checkpoint: /work3/s204157/experiments/finebio_resnet_motion_pretrain/epoch-56.model
  num_classes: 36  # Atomic actions

data:
  # Only FineBio PCR videos (42 videos)
  splits: /work3/s204157/data/labassist/combined_pcr/cache/splits_finebio_only.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr_resnet_motion/features
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6  # Same as pretrain
  num_f_maps: 64
  features_dim: 1024  # ResNet18 (512) + Motion (512)

training:
  num_epochs: 100
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.2
  smoothing_lambda: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

