exp_name: combined_pcr_vjepa_combined_reg
exp_dir: /work3/s204157/experiments/combined_pcr_vjepa_combined_reg
device: cuda:0

# Train from scratch with combined regularization
pretrained:
  checkpoint: null
  num_classes: null

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/splits.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_vjepa_selective_crop_flip_stride1
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 3  # Reduced capacity for regularization
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 100
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.5  # High dropout
  smoothing_lambda: 0.3   # Strong smoothing
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

logging:
  log_interval: 10
  save_every_n_epochs: 2

