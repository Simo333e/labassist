# Stage 2: Train from scratch on FineBio-only PCR videos using V-JEPA features
# This creates an intermediate checkpoint for mydata K-fold experiments
# No pretraining - train from scratch on FineBio data

exp_name: finebio_only_stage2_vjepa
exp_dir: /work3/s204157/experiments/finebio_only_stage2_vjepa
device: cuda:0

# Use atomic pretrain checkpoint
pretrained:
  checkpoint: /work3/s204157/experiments/finebio_vjepa_atomic_pretrain/epoch-60.model
  num_classes: 36  # Atomic actions

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/splits_finebio_only.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_vjepa_selective_crop_flip_stride1
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6  # Baseline capacity for V-JEPA
  num_f_maps: 64
  features_dim: 1024  # V-JEPA feature dimension

training:
  num_epochs: 100  # Standard training with pretrained weights
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.25  # Moderate regularization
  smoothing_lambda: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

logging:
  log_interval: 10
  save_every_n_epochs: 2

