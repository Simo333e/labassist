exp_name: ms_tcn_combined_pcr_vjepa_5class_trimmed_focal_v1
exp_dir: /work3/s204157/experiments/ms_tcn_combined_pcr_vjepa_5class_trimmed_focal_v1
device: cuda:0

# Train from scratch
pretrained:
  checkpoint: null
  num_classes: null

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/splits.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_vjepa_trimmed
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class_trimmed

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 100
  batch_size: 8
  lr: 1e-4
  use_class_weights: true
  max_class_weight: 10.0
  feature_dropout_p: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.50        # More background to reduce overclassification
  background_label: none
  # Focal Loss - helps with class imbalance by down-weighting easy examples
  use_focal_loss: true
  focal_gamma: 2.0                # Try 2.0 (default) or 3.0 for more aggressive focusing




