exp_name: ms_tcn_mydata_v4
exp_dir: /work3/s204157/experiments/ms_tcn_mydata_v4
device: cuda:0

pretrained:
  checkpoint: /work3/s204157/experiments/ms_tcn_causal_steps_resnet18_motion_v1/epoch-150.model
  num_classes: 33

data:
  splits: /work3/s204157/data/labassist/my_data/cache/splits.json
  class_index: /work3/s204157/data/labassist/my_data/cache/class_index.json
  xdir: /work3/s204157/data/labassist/my_data/cache/features_10hz_resnet18_motion_ctx5
  ydir: /work3/s204157/data/labassist/my_data/cache/labels

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
