# FineBio ResNet+Motion Atomic Action Pretraining
# Train MS-TCN on FULL FineBio dataset (ALL tasks, 221 videos) with atomic actions
# Using ResNet18 + Motion features (1024D: 512 RGB + 512 motion)
# This model will be used as pretrained weights for finetuning on combined_pcr

exp_name: ms_tcn_finebio_resnet_motion_pretrain
exp_dir: /work3/s204157/experiments/finebio_resnet_motion_pretrain
device: cuda:0

# Train from scratch
pretrained:
  checkpoint: null
  num_classes: null

data:
  # Full FineBio dataset - all tasks, all T5 views with 36 atomic actions
  splits: /work3/s204157/data/labassist/finebio_full/cache/splits_finebio_atomic.json
  class_index: /work3/s204157/data/labassist/finebio_full/cache/class_index_atomic.json
  xdir: /work3/s204157/data/labassist/finebio_full/cache/features_10hz_resnet18_motion
  ydir: /work3/s204157/data/labassist/finebio_full/cache/labels_atomic

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 1024  # ResNet+Motion: 512 RGB + 512 motion

training:
  num_epochs: 150  # Match I3D atomic pretrain for fair comparison
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.2
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  # Focal Loss for class imbalance
  use_focal_loss: true
  focal_gamma: 2.0
