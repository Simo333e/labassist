# Combined PCR Finetuning with ResNet+Motion Features
# Finetune on FineBio + mydata combined dataset
# Using pretrained model from FineBio atomic action pretraining

exp_name: ms_tcn_combined_pcr_resnet_motion
exp_dir: /work3/s204157/experiments/combined_pcr_resnet_motion
device: cuda:0

# Finetune from FineBio pretrained model
pretrained:
  checkpoint: /work3/s204157/experiments/finebio_resnet_motion_pretrain/epoch-50.model
  num_classes: null  # Auto-detect from pretrained model

data:
  splits: /work3/s204157/data/labassist/combined_pcr_resnet_motion/splits.json
  class_index: /work3/s204157/data/labassist/combined_pcr_resnet_motion/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr_resnet_motion/features
  ydir: /work3/s204157/data/labassist/combined_pcr_resnet_motion/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 1024  # ResNet+Motion: 512 RGB + 512 motion

training:
  num_epochs: 100
  batch_size: 8
  lr: 5e-5  # Lower LR for finetuning
  use_class_weights: false
  feature_dropout_p: 0.3  # Slightly higher dropout for finetuning
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  # Focal Loss for class imbalance
  use_focal_loss: true
  focal_gamma: 2.0
