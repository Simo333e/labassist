exp_name: ms_tcn_mydata_i3d_v1
exp_dir: /work3/s204157/experiments/ms_tcn_mydata_i3d_v1
device: cuda:0

pretrained:
  checkpoint: /work3/s204157/experiments/ms_tcn_causal_steps_i3d_v1/epoch-150.model
  num_classes: 33

data:
  splits: /work3/s204157/data/labassist/my_data/cache/splits.json
  class_index: /work3/s204157/data/labassist/my_data/cache/class_index.json
  xdir: /work3/s204157/data/labassist/my_data/cache/features_10hz_i3d
  ydir: /work3/s204157/data/labassist/my_data/cache/labels

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 512        # I3D feature dimensionality from precompute_features_i3d

training:
  num_epochs: 30
  batch_size: 16
  lr: 3e-4
  lr_finetune: 3e-4
  use_class_weights: true
  max_class_weight: 2.5
  feature_dropout_p: 0.10
  window_size: 256
  window_step: 128
  balanced_windows: true
  max_windows_per_video: 1000
  balanced_mix_ratio: 0.7
  background_label: none

augmentation:
  center_jitter: 1



