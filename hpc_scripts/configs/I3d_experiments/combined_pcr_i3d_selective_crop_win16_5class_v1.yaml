exp_name: ms_tcn_combined_pcr_i3d_selective_crop_win16_5class_v1
exp_dir: /work3/s204157/experiments/ms_tcn_combined_pcr_i3d_selective_crop_win16_5class_v1
device: cuda:0

# Train from scratch - no pretrained weights
pretrained:
  checkpoint: null
  num_classes: null

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/splits.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  # Use short-window (16 frames = 0.64 sec) selectively cropped features
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_i3d_selective_crop_win16
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 150
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.25  # Slightly higher dropout to reduce overfitting
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  # Focal Loss - handles class imbalance
  use_focal_loss: true
  focal_gamma: 2.0

