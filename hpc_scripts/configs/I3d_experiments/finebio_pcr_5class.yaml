# FineBio PCR Only - 5 Class Training
# Train MS-TCN on FineBio PCR videos only (no mydata) with 5-class labels
# This tests if the model can generalize to test data without any mydata in training

exp_name: ms_tcn_finebio_pcr_5class
exp_dir: /work3/s204157/experiments/finebio_pcr_5class
device: cuda:0

# Train from scratch (no pretrained weights)
pretrained:
  checkpoint: null
  num_classes: null

data:
  splits: /work3/s204157/data/labassist/finebio_pcr_5class/splits.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_i3d_selective_crop_flip_win16
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 100
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.2
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  # Focal Loss for class imbalance
  use_focal_loss: true
  focal_gamma: 2.0


