# Experiment 19: Cascaded Training with 7-class taxonomy (Stage 3) - V-JEPA
# Uses intermediate checkpoint trained on FineBio-only (Stage 2) with 7 classes

exp_name: mydata_kfold_exp19_cascaded_vjepa_7class_fold${FOLD_IDX}
exp_dir: /work3/s204157/experiments/mydata_kfold_exp19_cascaded_vjepa_7class/fold${FOLD_IDX}
device: cuda:0

# Start from FineBio-only 7-class intermediate checkpoint (Stage 2)
# NOTE: Update the checkpoint path to the best epoch from Stage 2 after training completes
pretrained:
  checkpoint: /work3/s204157/experiments/finebio_only_stage2_vjepa_7class/epoch-80.model
  num_classes: 7  # Adapted to 7-class in Stage 2

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/kfold_mydata/splits_fold${FOLD_IDX}.json
  class_index: /zhome/45/8/156251/Desktop/thesis/labassist/hpc_scripts/configs/class_index_7class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_vjepa_selective_crop_flip_stride1
  ydir: /zhome/45/8/156251/Desktop/thesis/labassist/hpc_scripts/data/labels_7class_combined_v2

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6  # Baseline capacity for V-JEPA
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 50
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.25  # Moderate regularization
  smoothing_lambda: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

logging:
  log_interval: 10
  save_every_n_epochs: 2

