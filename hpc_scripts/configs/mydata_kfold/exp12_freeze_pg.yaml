# Experiment 12: Freeze PG, Train Rs Only
# 
# This freezes the Prediction Generator stage and only trains the Refinement stages.
# The idea is to keep the learned temporal representations from FineBio frozen
# while allowing the refinement stages to adapt to the new action classes.
#
# Benefits:
# - More stable training (fewer parameters to optimize)
# - Preserves FineBio temporal modeling
# - Faster convergence

exp_name: mydata_kfold_exp12_freeze_pg_fold${FOLD_IDX}
exp_dir: /work3/s204157/experiments/mydata_kfold_exp12_freeze_pg/fold${FOLD_IDX}
device: cuda:0

# Use epoch-110 FineBio checkpoint (latest, better features)
pretrained:
  checkpoint: /work3/s204157/experiments/finebio_atomic_pretrain/epoch-110.model
  num_classes: 36

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/kfold_mydata/splits_fold${FOLD_IDX}.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_i3d_selective_crop_flip_win16
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 3
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 50
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.30    # Moderate dropout (less than exp4 since fewer params)
  # Note: smoothing_lambda is hardcoded to 0.15 in causal_model.py
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0
  # KEY: Freeze PG stage
  freeze_pg: true

