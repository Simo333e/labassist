# Experiment 15: Cascaded Training with V-JEPA features (Stage 3)
# Uses intermediate checkpoint trained from scratch on FineBio-only with V-JEPA (Stage 2)
# Clean separation: FineBio (from scratch) → mydata K-fold evaluation

exp_name: mydata_kfold_exp15_cascaded_vjepa_fold${FOLD_IDX}
exp_dir: /work3/s204157/experiments/mydata_kfold_exp15_cascaded_vjepa/fold${FOLD_IDX}
device: cuda:0

# Start from FineBio-only V-JEPA checkpoint (Stage 2)
# Using epoch-18 from Stage 2 (acc=0.992402)
pretrained:
  checkpoint: /work3/s204157/experiments/finebio_only_stage2_vjepa/epoch-52.model
  num_classes: 5  # Already adapted to 5-class PCR in Stage 2

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/kfold_mydata/splits_fold${FOLD_IDX}.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_vjepa_selective_crop_flip_stride1
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6  # Same as Stage 2
  num_f_maps: 64
  features_dim: 1024  # V-JEPA feature dimension

training:
  num_epochs: 50
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.25  # Moderate regularization
  smoothing_lambda: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

logging:
  log_interval: 10
  save_every_n_epochs: 2

