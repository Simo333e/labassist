# Experiment 10: I3D From Scratch (No Pretraining)
# Baseline for fair comparison with exp9 (I3D+YOLO)
#
# Purpose: Both exp9 and exp10 train from scratch to isolate the effect
# of YOLO features. If exp9 > exp10 on Pipette/Aspirate confusion,
# then YOLO object detection features provide real value.
#
# Note: Performance will be lower than exp1_baseline (which uses FineBio
# pretraining), but this is a fair apples-to-apples comparison.

exp_name: mydata_kfold_exp10_i3d_scratch_fold${FOLD_IDX}
exp_dir: /work3/s204157/experiments/mydata_kfold_exp10_i3d_scratch/fold${FOLD_IDX}
device: cuda:0

# NO pretraining - for fair comparison with I3D+YOLO
pretrained:
  checkpoint: null
  num_classes: null

data:
  # K-fold split file (replaced per fold)
  splits: /work3/s204157/data/labassist/combined_pcr/cache/kfold_mydata/splits_fold${FOLD_IDX}.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  # I3D features only (same as baseline)
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_i3d_selective_crop_flip_win16
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6  # Same as baseline
  num_f_maps: 64
  features_dim: 1024

training:
  num_epochs: 50
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.25
  smoothing_lambda: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

