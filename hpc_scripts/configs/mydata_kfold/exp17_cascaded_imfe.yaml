# Cascade Training Stage 3: K-Fold on mydata with IMFE
# Starting from finebio_only_stage2_imfe checkpoint
# Training ONLY on mydata with 5-fold cross-validation
# Using IMFE features (2048D) from RT-HARE

exp_name: mydata_kfold_exp17_cascaded_imfe_fold${FOLD_IDX}
exp_dir: /work3/s204157/experiments/mydata_kfold_exp17_cascaded_imfe/fold${FOLD_IDX}
device: cuda:0

pretrained:
  # Will be updated after Stage 2 evaluation to pick best epoch
  checkpoint: /work3/s204157/experiments/finebio_only_stage2_imfe/epoch-2.model
  num_classes: 5  # PCR actions

data:
  splits: /work3/s204157/data/labassist/combined_pcr/cache/kfold_mydata/splits_fold${FOLD_IDX}.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_imfe
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6  # Same as Stage 2
  num_f_maps: 64
  features_dim: 2048  # IMFE feature dimension

training:
  num_epochs: 50
  batch_size: 8
  lr: 5e-5  # Lower LR for fine-tuning
  use_class_weights: false
  feature_dropout_p: 0.3
  smoothing_lambda: 0.15
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  use_focal_loss: true
  focal_gamma: 2.0

