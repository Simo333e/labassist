# Template config for mydata K-fold cross-validation
# The FOLD_IDX placeholder will be replaced by the training script

exp_name: ms_tcn_mydata_i3d_kfold_fold${FOLD_IDX}
exp_dir: /work3/s204157/experiments/mydata_kfold/ms_tcn_mydata_i3d_fold${FOLD_IDX}
device: cuda:0

# Train from scratch - no pretrained weights
pretrained:
  checkpoint: null
  num_classes: null

data:
  # K-fold split file (replaced per fold)
  splits: /work3/s204157/data/labassist/combined_pcr/cache/kfold_mydata/splits_fold${FOLD_IDX}.json
  class_index: /work3/s204157/data/labassist/combined_pcr/cache/class_index_5class.json
  # Use the flipped + cropped + short window I3D features
  xdir: /work3/s204157/data/labassist/combined_pcr/cache/features_10hz_i3d_selective_crop_flip_win16
  ydir: /work3/s204157/data/labassist/combined_pcr/cache/labels_5class

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 1024

training:
  # Fewer epochs for smaller dataset
  num_epochs: 100
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.25
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  # Focal Loss - handles class imbalance
  use_focal_loss: true
  focal_gamma: 2.0

