# FineBio IMFE Atomic Action Pretraining
# Train MS-TCN on FULL FineBio dataset (ALL tasks, 223 videos) with atomic actions
# Using IMFE features (2048D)
# This model will be used as pretrained weights for finetuning on combined_pcr

exp_name: ms_tcn_finebio_imfe_atomic_pretrain
exp_dir: /work3/s204157/experiments/finebio_imfe_atomic_pretrain
device: cuda:0

# Train from scratch
pretrained:
  checkpoint: null
  num_classes: null

data:
  # Full FineBio dataset - all tasks, all T5 views with 36 atomic actions
  splits: /work3/s204157/data/labassist/finebio_full/cache/splits_finebio_atomic.json
  class_index: /work3/s204157/data/labassist/finebio_full/cache/class_index_atomic.json
  xdir: /work3/s204157/data/labassist/finebio_full/cache/features_10hz_imfe
  ydir: /work3/s204157/data/labassist/finebio_full/cache/labels_atomic

model:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 6
  num_f_maps: 64
  features_dim: 2048  # IMFE features are 2048D

training:
  num_epochs: 150  # Match I3D atomic pretrain for fair comparison
  batch_size: 8
  lr: 1e-4
  use_class_weights: false
  feature_dropout_p: 0.2
  window_size: 256
  window_step: 64
  balanced_windows: true
  max_windows_per_video: 300
  balanced_mix_ratio: 0.90
  background_label: none
  # Focal Loss for class imbalance
  use_focal_loss: true
  focal_gamma: 2.0

logging:
  log_interval: 10
  save_every_n_epochs: 2


